name: Version

# Bumps the version, writes CHANGELOG.md and tags the release whenever something
# releasable lands on main.
#
# ## It never pushes to main
#
# `main` is protected by a ruleset whose `pull_request` rule has no bypass
# actors — every change goes through a PR, the bot's included. This workflow
# used to finish with `git push --follow-tags origin HEAD:main`, and from the
# day that rule was switched on (2 October 2026) every run died there. Worse,
# `--follow-tags` is not atomic: the remote accepted the *tag* and refused the
# *branch*, so each failed run left a tag pointing at a release commit that is
# not on main. v1.12.0 and v1.12.1 are both that — orphans, never released.
#
# So the release is a pull request now, in two halves:
#
#   1. `version` — on a releasable push, run standard-version on a fresh
#      branch from main **without tagging**, force-push it as `release/next`,
#      and open (or retitle) the release PR. One rolling branch, regenerated
#      from main on every releasable push, so there is only ever one release
#      PR and it always describes everything unreleased.
#   2. `tag` — on every push to main, if the version in package.json has a
#      `chore(release):` commit in main's history and no tag yet, tag that
#      commit. This is what runs when the release PR is merged, and it is the
#      only thing that creates a tag — so a tag exists only for a release that
#      actually landed.
#
# `tag` runs first and `version` waits for it, so the push that merges the
# release PR tags it and then finds nothing left to release.
#
# ## Loops, and why the release commit no longer carries [skip ci]
#
# The release PR's merge is itself a push to main. The `version` job refuses a
# `chore(release):` head commit, and its releasable-commit count starts from
# the tag `tag` has just pushed, so there is nothing for it to do. `[skip ci]`
# would have been the second guard, but on a rebase or squash merge it lands in
# the head commit and GitHub then skips this whole workflow — including the
# `tag` job, which is the one run that must not be skipped. The cost is that
# merging the release PR deploys to production, which is also what puts the new
# version on screen rather than leaving production one patch behind.
#
# ## Collisions
#
# standard-version computes the next version from `package.json`. If that tag
# already exists — the orphans above, a tag pushed by hand, a force-push over a
# release commit — the version step steps the patch until it finds a free one,
# rather than releasing nothing and leaving those commits out of the changelog.
#
# ## The repository setting this depends on
#
# Opening the PR with the workflow's own token needs "Allow GitHub Actions to
# create and approve pull requests" (Settings → Actions → General). With it off
# the branch is still pushed, the PR step prints a link to open it by hand, and
# the run still succeeds. A PR opened by the workflow token triggers no other
# workflows, so CI does not run on it; the ruleset requires no status checks,
# and CI runs on main when it merges.

on:
  push:
    branches: [main]

# One release at a time. Two concurrent runs would both push a tag and one
# would lose the race with a non-fast-forward error halfway through.
concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Tag a release that has just landed
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1 ||
             [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "${tag} is already tagged. Nothing to do."
            exit 0
          fi

          # The release commit standard-version wrote, by its subject. On a
          # squash merge the subject gains " (#N)", which this still matches.
          release_commit="$(
            git log -1 --no-merges --format=%H -E --grep="^chore\(release\): ${version//./\\.}( |$)" HEAD || true
          )"

          if [ -z "$release_commit" ]; then
            echo "No release commit for ${version} on main yet. Nothing to tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$tag" "$release_commit" -m "chore(release): ${version}"
          # A tag is not a branch, so the main ruleset does not apply to it.
          git push origin "refs/tags/${tag}"
          echo "Tagged ${release_commit} as ${tag}."

  version:
    needs: tag
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # standard-version reads every commit back to the previous tag, so a
          # shallow clone would produce an empty changelog.
          fetch-depth: 0
          # Keeps the checkout token available to `git push` at the end.
          persist-credentials: true

      - name: Is there anything to release?
        id: check
        run: |
          set -euo pipefail

          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "$last_tag" ]; then
            echo "No tags yet — this will be the first release."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The commit types standard-version puts in a changelog, plus the
          # breaking-change trailer. `chore`, `docs`, `style` and `test` alone
          # are not worth a version.
          releasable="$(
            git log "$last_tag..HEAD" --pretty=format:'%s%n%b' \
              | grep -cE '^(feat|fix|perf|refactor|revert)(\(.+\))?!?:|^BREAKING[ -]CHANGE' \
              || true
          )"

          echo "Found $releasable releasable commit(s) since $last_tag."
          if [ "$releasable" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.release == 'true'
        # `--ignore-scripts` skips the `prisma generate` postinstall. Releasing
        # needs the changelog tooling and nothing else; generating a database
        # client here would only make the job slower.
        run: npm ci --ignore-scripts

      - name: Which version, and is that tag free?
        id: version
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail

          # `--dry-run` writes nothing — no bump, no changelog, no commit, no
          # tag. It is the only way to ask standard-version what it *would*
          # call this release without letting it do it, and the answer is the
          # one thing this job cannot work out for itself: the bump depends on
          # the commit types since the last tag.
          next="$(
            npx standard-version --dry-run 2>&1 \
              | grep -oE 'tagging release v[0-9]+\.[0-9]+\.[0-9]+' \
              | tail -1 \
              | sed 's/^tagging release //' || true
          )"

          if [ -z "$next" ]; then
            echo "::error::Could not work out the next version from standard-version's dry run."
            exit 1
          fi

          echo "standard-version would tag $next."

          # Both sides, because they fail differently. A local tag is what
          # `git tag` refuses; a remote one is what `git push --follow-tags`
          # refuses, several steps later and with a bump commit already made.
          # `fetch-depth: 0` brings the remote tags down, so the first check
          # usually catches both — the second is for a tag pushed between the
          # checkout and now.
          taken() {
            git rev-parse -q --verify "refs/tags/$1" >/dev/null 2>&1 ||
              [ -n "$(git ls-remote --tags origin "refs/tags/$1" 2>/dev/null)" ]
          }

          release_as=""

          if taken "$next"; then
            # Step the patch until something is free. Bumping past a taken
            # version rather than skipping the release: the commits that earned
            # it are real, and a job that quietly released nothing would leave
            # them out of the changelog for good — the next push would compute
            # the same taken version and skip again.
            major="$(echo "${next#v}" | cut -d. -f1)"
            minor="$(echo "${next#v}" | cut -d. -f2)"
            patch="$(echo "${next#v}" | cut -d. -f3)"

            for _ in $(seq 1 50); do
              patch=$((patch + 1))
              candidate="v${major}.${minor}.${patch}"
              taken "$candidate" || break
              candidate=""
            done

            if [ -z "${candidate:-}" ]; then
              echo "::error::$next is taken and so are the next 50 patches. Something is wrong with this repository's tags."
              exit 1
            fi

            echo "::warning::$next already exists — releasing ${candidate} instead."
            release_as="${candidate#v}"
          fi

          echo "release_as=$release_as" >> "$GITHUB_OUTPUT"

      - name: Push the release branch
        id: release
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c release/next

          # Empty for the ordinary case, which is the whole point: standard-
          # version works the version out itself unless the one it chose is
          # already taken.
          release_as="${{ steps.version.outputs.release_as }}"

          # `--skip.tag`: the tag is the `tag` job's, once this is on main.
          npx standard-version \
            ${release_as:+--release-as "$release_as"} \
            --skip.tag \
            --releaseCommitMessageFormat "chore(release): {{currentTag}}"

          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # Rebuilt from main every time, so a force-push is the intent: the
          # branch is a generated artefact, never somebody's work.
          git push --force origin HEAD:refs/heads/release/next

      - name: Open or update the release PR
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          title="chore(release): ${VERSION}"
          body="$(cat <<EOF
          Generated by version.yml from \`main\` at ${GITHUB_SHA}.

          Merging this lands the bump to **${VERSION}** and its CHANGELOG entry on main; the \`tag\` job then tags it \`v${VERSION}\`. Nothing is tagged until it merges. This branch is rebuilt on every releasable push to main, so a newer push replaces it.
          EOF
          )"

          existing="$(gh pr list --head release/next --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated release PR #${existing} to ${VERSION}."
          elif gh pr create --base main --head release/next --title "$title" --body "$body"; then
            echo "Opened the release PR for ${VERSION}."
          else
            # "GitHub Actions is not permitted to create or approve pull
            # requests" — a repository setting, not a fault in the release.
            echo "::warning::Could not open the release PR (is 'Allow GitHub Actions to create and approve pull requests' off?). Open it by hand: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...release/next?expand=1"
          fi
