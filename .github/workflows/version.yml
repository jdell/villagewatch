name: Version

# Bumps the version, writes CHANGELOG.md and tags the commit whenever something
# releasable lands on main.
#
# Two loops have to be broken for this to be safe, because the workflow's own
# output is a push to the branch that triggers it:
#
#   1. The release commit carries `[skip ci]`, which GitHub Actions and Vercel
#      both honour — so the bump neither re-triggers this workflow nor spends a
#      production deploy on a commit that changed a version number.
#   2. The `if` below refuses to run on a `chore(release):` commit regardless.
#      Belt and braces: a skip keyword is a convention, and the cost of it
#      silently changing is an infinite loop that tags a hundred versions.
#
# It also refuses to release nothing. standard-version bumps a patch even when
# every commit since the last tag was a `chore`, so the first step works out
# whether anything user-visible actually landed and stops if it did not.
#
# And it refuses to collide. standard-version computes the next version from
# `package.json` and tags it; if that tag already exists the run dies at
# `git tag` with "tag already exists", *after* it has written the changelog and
# the bump commit. The version step below works the tag out first and steps past
# any that are taken, so a repository whose tags and `package.json` have drifted
# apart — a force-push over a release commit, a tag pushed by hand, a squashed
# merge that dropped the bump — releases the next free version instead of failing
# every push to main until somebody deletes a tag.

on:
  push:
    branches: [main]

# One release at a time. Two concurrent runs would both push a tag and one
# would lose the race with a non-fast-forward error halfway through.
concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # standard-version reads every commit back to the previous tag, so a
          # shallow clone would produce an empty changelog.
          fetch-depth: 0
          # Keeps the checkout token available to `git push` at the end.
          persist-credentials: true

      - name: Is there anything to release?
        id: check
        run: |
          set -euo pipefail

          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [ -z "$last_tag" ]; then
            echo "No tags yet — this will be the first release."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The commit types standard-version puts in a changelog, plus the
          # breaking-change trailer. `chore`, `docs`, `style` and `test` alone
          # are not worth a version.
          releasable="$(
            git log "$last_tag..HEAD" --pretty=format:'%s%n%b' \
              | grep -cE '^(feat|fix|perf|refactor|revert)(\(.+\))?!?:|^BREAKING[ -]CHANGE' \
              || true
          )"

          echo "Found $releasable releasable commit(s) since $last_tag."
          if [ "$releasable" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.release == 'true'
        # `--ignore-scripts` skips the `prisma generate` postinstall. Releasing
        # needs the changelog tooling and nothing else; generating a database
        # client here would only make the job slower.
        run: npm ci --ignore-scripts

      - name: Which version, and is that tag free?
        id: version
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail

          # `--dry-run` writes nothing — no bump, no changelog, no commit, no
          # tag. It is the only way to ask standard-version what it *would*
          # call this release without letting it do it, and the answer is the
          # one thing this job cannot work out for itself: the bump depends on
          # the commit types since the last tag.
          next="$(
            npx standard-version --dry-run 2>&1 \
              | grep -oE 'tagging release v[0-9]+\.[0-9]+\.[0-9]+' \
              | tail -1 \
              | sed 's/^tagging release //' || true
          )"

          if [ -z "$next" ]; then
            echo "::error::Could not work out the next version from standard-version's dry run."
            exit 1
          fi

          echo "standard-version would tag $next."

          # Both sides, because they fail differently. A local tag is what
          # `git tag` refuses; a remote one is what `git push --follow-tags`
          # refuses, several steps later and with a bump commit already made.
          # `fetch-depth: 0` brings the remote tags down, so the first check
          # usually catches both — the second is for a tag pushed between the
          # checkout and now.
          taken() {
            git rev-parse -q --verify "refs/tags/$1" >/dev/null 2>&1 ||
              [ -n "$(git ls-remote --tags origin "refs/tags/$1" 2>/dev/null)" ]
          }

          release_as=""

          if taken "$next"; then
            # Step the patch until something is free. Bumping past a taken
            # version rather than skipping the release: the commits that earned
            # it are real, and a job that quietly released nothing would leave
            # them out of the changelog for good — the next push would compute
            # the same taken version and skip again.
            major="$(echo "${next#v}" | cut -d. -f1)"
            minor="$(echo "${next#v}" | cut -d. -f2)"
            patch="$(echo "${next#v}" | cut -d. -f3)"

            for _ in $(seq 1 50); do
              patch=$((patch + 1))
              candidate="v${major}.${minor}.${patch}"
              taken "$candidate" || break
              candidate=""
            done

            if [ -z "${candidate:-}" ]; then
              echo "::error::$next is taken and so are the next 50 patches. Something is wrong with this repository's tags."
              exit 1
            fi

            echo "::warning::$next already exists — releasing ${candidate} instead."
            release_as="${candidate#v}"
          fi

          echo "release_as=$release_as" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.check.outputs.release == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Empty for the ordinary case, which is the whole point: standard-
          # version works the version out itself unless the one it chose is
          # already taken.
          release_as="${{ steps.version.outputs.release_as }}"

          npx standard-version \
            ${release_as:+--release-as "$release_as"} \
            --releaseCommitMessageFormat "chore(release): {{currentTag}} [skip ci]"

          git push --follow-tags origin HEAD:${{ github.ref_name }}
